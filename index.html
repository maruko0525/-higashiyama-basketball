button data-digit="7">7</button><button data-digit="8">8</button><button data-digit="9">9</button><button id="back">⌫</button><button data-digit="0">0</button><button id="clear">C</button><button class="enter" id="enter">エンター ／ 確定</button><button class="cancel" id="cancel">キャンセル</button></div><div class="actions" id="actions"><button data-play="shot">シュート</button><button data-play="steal">スティール</button><button data-play="freeThrow">フリースロー</button><button data-play="rebound">リバウンド</button><button data-play="assist">アシスト</button><button data-play="pass">パス</button><button data-play="turnover">ターンオーバー</button><button data-play="block">ブロック</button><button data-play="foul">ファウル</button><div class="result" id="shotResult" hidden><button data-outcome="made">○ 成功</button><button class="miss" data-outcome="missed">× 不成功</button></div><div class="result" id="rebResult" hidden><button data-outcome="offensive">攻撃リバウンド</button><button data-outcome="defensive">守備リバウンド</button></div></div></div><p class="foot">位置はコート上をタップ。キャンセルは入力中のプレーを破棄します。</p><div class="review"><b>記録一覧</b><span>タップするとコート上の位置を確認できます</span><button id="showAll">全位置</button><button id="stopReview">表示を戻す</button></div><ol class="history" id="history"></ol></main><dialog id="modal"><div class="modalInner"><h2 id="modalTitle">試合情報</h2><label>試合を選択<select id="modalGameSelect"></select></label><label>試合日 <input id="gameDate" type="date"></label><label>対戦チーム <input id="opponent" placeholder="例：○○高校"></label><label>東山の選手（背番号,選手名を1行ずつ）<textarea id="homeRoster" placeholder="7,山田 太郎"></textarea></label><label>相手の選手（背番号,選手名を1行ずつ）<textarea id="awayRoster" placeholder="4,佐藤 次郎"></textarea></label><div id="summary"></div><div class="modalButtons"><button id="saveInfo">保存して閉じる</button><button id="skipInfo">いったんスキップ</button><button id="downloadStats">集計CSV</button><button id="shareStats">共有</button><button id="closeModal">閉じる</button></div></div></dialog><style>.hint select{background:#26394f;color:white;border:1px solid #58728c;border-radius:7px;padding:5px}.modalInner{min-width:min(85vw,440px);max-height:80dvh;overflow:auto}dialog{border:1px solid #607998;border-radius:14px;color:white;background:#17263a;max-width:95vw}dialog::backdrop{background:#000a}.modalInner label{display:block;font-size:12px;margin:10px 0}.modalInner input,.modalInner textarea{display:block;width:100%;margin-top:4px;background:#253950;color:white;border:1px solid #5b7190;border-radius:6px;padding:8px}.modalInner textarea{min-height:65px}.modalButtons{display:flex;flex-wrap:wrap;gap:6px}.modalButtons button{padding:8px;color:white;background:#315374;border:0;border-radius:7px}#summary{font-size:12px;overflow:auto;max-height:30dvh}#summary table{border-collapse:collapse}#summary td,#summary th{padding:5px;border:1px solid #4e637b;white-space:nowrap}</style><script>
(()=>{'use strict';const labels={freeThrow:'フリースロー',shot:'シュート',steal:'スティール',rebound:'リバウンド',assist:'アシスト',pass:'パス',turnover:'ターンオーバー',block:'ブロック',foul:'ファウル'},two=new Set(['assist','pass']);const storeKey='higashiyama-games-v2';let games=[],activeId=null,game={},records=[];try{const saved=JSON.parse(localStorage.getItem(storeKey)||'null');if(saved&&Array.isArray(saved.games)&&saved.games.length){games=saved.games;activeId=saved.activeId;let found=games.find(g=>g.id===activeId)||games[0];activeId=found.id;game=found.info||{};records=Array.isArray(found.records)?found.records:[]}else{let oldInfo={},oldRecords=[];try{oldInfo=JSON.parse(localStorage.getItem('higashiyama-game-v1')||'{}');oldRecords=JSON.parse(localStorage.getItem('higashiyama-records-v1')||'[]')}catch{}if(!Array.isArray(oldRecords))oldRecords=[];activeId='game-'+Date.now();game=oldInfo||{};records=oldRecords;games=[{id:activeId,info:game,records}];localStorage.setItem(storeKey,JSON.stringify({activeId,games}))}}catch{activeId='game-'+Date.now();games=[{id:activeId,info:game,records}]}let review=null;let state={phase:'first',digits:'',first:null,second:null,play:null,outcome:null,points:[]};const $=x=>document.getElementById(x);function shotType(p){if(!p)return '2P';const x=p.x*9.4,y=p.y*5, left=x<=470,hx=left?50:890,dx=left?x:940-x;return (dx<=131&&Math.abs(y-250)>=185)||Math.hypot(x-hx,y-250)>202?'3P':'2P'}function playName(r){return r.play==='shot'?shotType(r.points?.[0])+'シュート':labels[r.play]}function sync(){const g=games.find(x=>x.id===activeId);if(g){g.info=game;g.records=records}try{localStorage.setItem(storeKey,JSON.stringify({activeId,games}))}catch{alert('保存容量がいっぱいです。全試合を保存してください')}}function updateGames(){const select=$('modalGameSelect');select.innerHTML='';for(const g of games){const o=document.createElement('option');o.value=g.id;o.textContent=(g.info?.date||'日付未入力')+' 対 '+(g.info?.opponent||'対戦相手未入力')+(g.info?.ended?' 試合終了':g.info?.paused?' 一時保存':' 記録中');select.appendChild(o)}select.value=activeId;$('gameLabel').textContent=(game.date||'日付未入力')+' 対 '+(game.opponent||'対戦相手未入力')+(game.ended?' 試合終了':game.paused?' 一時保存':' 記録中');$('newGame').hidden=!game.ended;$('pause').textContent=game.paused?'記録を再開':'一時保存';$('pause').hidden=!!game.ended;$('finish').hidden=!!game.ended}function reset(){state={phase:'first',digits:'',first:null,second:null,play:null,outcome:null,points:[]};draw()}function show(msg){$('status').innerHTML=msg}function draw(){const s=state,loc=s.points.length;let message=game.ended?'この試合は終了しています。選手名の編集と結果の確認ができます':game.paused?'一時保存中です。「記録を再開」を押すと続きから入力できます':s.phase==='first'?'① 背番号を入力し、エンターで確定':s.phase==='play'?`#${s.first}　② プレーを選択`:s.phase==='outcome'?`#${s.first} ${labels[s.play]}　③ 成功・不成功を選択`:s.phase==='rebound'?`#${s.first} リバウンド　③ 攻撃・守備を選択`:s.phase==='position'?`#${s.first} ${labels[s.play]}　③ コートを${two.has(s.play)?'2箇所':'1箇所'}タップ → エンターで位置を確定`:s.phase==='second'?`#${s.first} → ${labels[s.play]}　④ 受け手の背番号を入力 → エンターで保存`:'記録中';show(`<b>${message}</b><br>位置 ${loc}/${two.has(s.play)?2:1}${s.points.length?' · '+s.points.map((p,i)=>`${i+1}: ${Math.round(p.x)}%,${Math.round(p.y)}%`).join(' → '):''}`);$('hint').textContent=review!==null?'記録位置を表示中':s.phase==='position'?`コートをタップ：${two.has(s.play)?'起点 → 終点':'プレー位置'}`:s.phase==='second'?'受け手の背番号を入力':'プレーを記録';$('number').textContent=s.digits||'背番号 ―';$('shotResult').hidden=s.phase!=='outcome';$('rebResult').hidden=s.phase!=='rebound';document.querySelectorAll('[data-play]').forEach(b=>b.classList.toggle('selected',b.dataset.play===s.play));const shown=review==='all'?records.filter(r=>r.points?.length).flatMap((r,j)=>r.points.map((p,i)=>({p,i,r}))):review!==null?(records[review]?.points||[]).map((p,i)=>({p,i,r:records[review]})):s.points.map((p,i)=>({p,i,r:null}));$('markers').innerHTML=shown.map(({p,i,r})=>`<g><circle cx="${p.x*9.4}" cy="${p.y*5}" r="13" fill="${i?'#3d91ff':'#ff553f'}" stroke="white" stroke-width="3"/><text x="${p.x*9.4}" y="${p.y*5+5}" text-anchor="middle" fill="white" font-size="16" font-weight="bold">${i+1}</text></g>`).join('');$('count').textContent=records.length+'件';updateGames();$('history').innerHTML=records.map((r,i)=>({...r,index:i})).reverse().map(r=>`<li><button data-index=\"${r.index}\">${new Date(r.time).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}　#${r.player}${r.receiver?' → #'+r.receiver:''}　${r.quarter||'1Q'} ${playName(r)} ${r.outcome?({'made':'○ 成功','missed':'× 不成功','offensive':'攻撃','defensive':'守備'}[r.outcome]||''):''}　📍</button></li>`).join('');document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>{review=+b.dataset.index;draw();$('court').scrollIntoView({block:'center',behavior:'smooth'})})}function save(){if(game.ended||game.paused)return;let s=state;review=null;records.push({id:crypto.randomUUID?.()||String(Date.now()),time:new Date().toISOString(),player:s.first,receiver:s.second,play:s.play,quarter:$('quarter').value,outcome:s.outcome,points:s.points});sync();reset()}document.querySelectorAll('[data-digit]').forEach(b=>b.onclick=()=>{if(game.ended||game.paused||!['first','second'].includes(state.phase))return;if(state.digits.length<2)state.digits+=b.dataset.digit;draw()});$('back').onclick=()=>{state.digits=state.digits.slice(0,-1);draw()};$('clear').onclick=()=>{state.digits='';draw()};$('enter').onclick=()=>{if(game.ended||game.paused)return alert('記録を再開するか新しい試合を開始してください');let s=state;if(s.phase==='first'){if(!s.digits)return alert('背番号を入力してください');s.first=s.digits;s.digits='';s.phase='play'}else if(s.phase==='position'){if(s.points.length!==(two.has(s.play)?2:1))return alert('必要な位置をコートで選択してください');if(two.has(s.play))s.phase='second';else save()}else if(s.phase==='second'){if(!s.digits)return alert('受け手の背番号を入力してください');s.second=s.digits;save()}else alert('先にプレーを選択してください');draw()};$('cancel').onclick=()=>{if(!game.ended&&!game.paused&&state.phase==='first'&&!state.digits&&records.length&&confirm('直前の記録を取り消しますか？')){records.pop();sync()}reset()};document.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>{if(game.ended||game.paused)return alert('記録を再開するか新しい試合を開始してください');if(state.phase!=='play')return alert('先に背番号を確定してください');state.play=b.dataset.play;state.phase=['shot','freeThrow'].includes(state.play)?'outcome':state.play==='rebound'?'rebound':'position';draw()});document.querySelectorAll('[data-outcome]').forEach(b=>b.onclick=()=>{if(!['outcome','rebound'].includes(state.phase))return;state.outcome=b.dataset.outcome;state.phase='position';draw()});$('court').onclick=e=>{if(review!==null){review=null;draw();return}if(game.ended||game.paused)return;let s=state;if(s.phase!=='position')return;const box=$('court').getBoundingClientRect(),x=Math.max(0,Math.min(100,(e.clientX-box.left)/box.width*100)),y=Math.max(0,Math.min(100,(e.clientY-box.top)/box.height*100)),n=two.has(s.play)?2:1;if(s.points.length>=n)s.points=[];s.points.push({x:+x.toFixed(2),y:+y.toFixed(2)});if($('quick').checked&&s.points.length===n&&!two.has(s.play)){save();return}draw()};if($('export'))$('export').onclick=()=>{const cols=['time','quarter','player','play','outcome','receiver','x1_percent','y1_percent','x2_percent','y2_percent'];const csv='\ufeff'+[cols.join(','),...records.map(r=>[r.time,r.quarter||'1Q',r.player,r.play,r.outcome||'',r.receiver||'',r.points?.[0]?.x??'',r.points?.[0]?.y??'',r.points?.[1]?.x??'',r.points?.[1]?.y??''].join(','))].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='higashiyama-plays-'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
function persistGame(){if(!game.ended){game.date=$('gameDate').value;game.opponent=$('opponent').value}game.home=$('homeRoster').value;game.away=$('awayRoster').value;sync();draw()}
function names(raw){return Object.fromEntries((raw||'').split('\n').map(x=>x.split(',').map(v=>v.trim())).filter(x=>x.length>=2&&x[0]))}
function stats(){const home=names(game.home),away=names(game.away),rows={};for(const r of records){let k=r.player;if(!rows[k])rows[k]={number:k,name:home[k]||'',pts:0,fgm:0,fga:0,p2m:0,p2a:0,p3m:0,p3a:0,ftm:0,fta:0,reb:0,oreb:0,dreb:0,ast:0,stl:0,tov:0,blk:0,pf:0,passes:0};let v=rows[k];if(r.play==='shot'){let n=shotType(r.points?.[0])==='3P'?3:2;v.fga++;v['p'+n+'a']++;if(r.outcome==='made'){v.fgm++;v['p'+n+'m']++;v.pts+=n}}if(r.play==='freeThrow'){v.fta++;if(r.outcome==='made'){v.ftm++;v.pts++}}if(r.play==='rebound'){v.reb++;if(r.outcome==='offensive')v.oreb++;else v.dreb++}if(r.play==='assist')v.ast++;if(r.play==='steal')v.stl++;if(r.play==='turnover')v.tov++;if(r.play==='block')v.blk++;if(r.play==='foul')v.pf++;if(r.play==='pass')v.passes++}return {home,away,rows:Object.values(rows).sort((a,b)=>+a.number-+b.number)}}
function renderSummary(){const {rows}=stats(),pct=(m,a)=>a?(m/a*100).toFixed(1)+'%':'—';$('summary').innerHTML='<h3>東山 スタッツ</h3><div>対戦：'+(game.opponent||'未入力')+' ／ '+(game.date||'日付未入力')+' ／ '+records.length+'プレー</div><table><tr><th>#</th><th>名前</th><th>得点</th><th>2P</th><th>2P%</th><th>3P</th><th>3P%</th><th>FG%</th><th>FT</th><th>FT%</th><th>REB</th><th>AST</th><th>STL</th><th>TO</th></tr>'+rows.map(v=>'<tr><td>'+v.number+'</td><td>'+v.name+'</td><td>'+v.pts+'</td><td>'+v.p2m+'/'+v.p2a+'</td><td>'+pct(v.p2m,v.p2a)+'</td><td>'+v.p3m+'/'+v.p3a+'</td><td>'+pct(v.p3m,v.p3a)+'</td><td>'+pct(v.fgm,v.fga)+'</td><td>'+v.ftm+'/'+v.fta+'</td><td>'+pct(v.ftm,v.fta)+'</td><td>'+v.reb+'</td><td>'+v.ast+'</td><td>'+v.stl+'</td><td>'+v.tov+'</td></tr>').join('')+'</table><p>2P・3Pはタップした位置とコートのラインから自動判定。ライン上は2Pです。</p>'}
function openInfo(){updateGames();$('gameDate').value=game.date||new Date().toLocaleDateString('sv-SE');$('opponent').value=game.opponent||'';$('homeRoster').value=game.home||'';$('awayRoster').value=game.away||'';$('gameDate').disabled=!!game.ended;$('opponent').disabled=!!game.ended;$('modalTitle').textContent=game.ended?'試合終了・スタッツ':game.paused?'一時保存・試合情報':'試合情報・スタッツ';renderSummary();if(!$('modal').open)$('modal').showModal()}
$('showAll').onclick=()=>{review='all';draw();$('court').scrollIntoView({block:'center',behavior:'smooth'})};$('stopReview').onclick=()=>{review=null;draw()};$('modalGameSelect').onchange=()=>{persistGame();activeId=$('modalGameSelect').value;const found=games.find(g=>g.id===activeId);game=found.info||{};records=found.records||[];review=null;reset();$('quarter').value='1Q';sync();openInfo()};$('newGame').onclick=()=>{activeId='game-'+Date.now();game={date:new Date().toLocaleDateString('sv-SE'),opponent:'',home:game.home||'',away:'',ended:false,paused:false};records=[];games.push({id:activeId,info:game,records});review=null;reset();$('quarter').value='1Q';sync();openInfo()};$('pause').onclick=()=>{if(game.ended)return;if(game.paused){game.paused=false;sync();draw();return}if(state.phase!=='first'&& !confirm('入力途中のプレーは破棄して一時保存しますか？'))return;game.paused=true;reset();sync()};$('gameInfo').onclick=()=>openInfo();$('finish').onclick=()=>{if(game.ended)return;if(!game.date||!game.opponent){openInfo();alert('試合終了前に試合日と対戦チームを入力して保存してください');return}if(!confirm('この試合を終了しますか？終了後は背番号と選手名のみ変更できます。'))return;game.ended=true;game.paused=false;reset();sync();openInfo()};$('saveInfo').onclick=()=>{persistGame();$('modal').close()};$('skipInfo').onclick=()=>{$('modal').close()};$('closeModal').onclick=()=>$('modal').close();
$('downloadStats').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([report()],{type:'text/csv;charset=utf-8'}));a.download='東山_試合スタッツ_'+(game.date||'未設定')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)};
$('shareStats').onclick=async()=>{const file=new File([report()],'東山_試合スタッツ.csv',{type:'text/csv'});if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:'東山バスケ 試合スタッツ'})}catch{}}else $('downloadStats').click()};draw()})();
</script></body></html>
